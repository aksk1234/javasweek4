    <h1>체질량 지수 계산기</h1>
    <form name="myform" action="..." method="POST">
        <br>
        신장(m): <input id="height">
        <br>
        체중(kg): <input id="weight">
        <br>
        <input type="button" value="계산" onclick="calc();" />
        <h3 id="result"></h3>
        <h3 id="result2"></h3>
        
        <button type="button" onclick="sub();">눌러주세요!</button>
        <h3 id="test"></h3>
    </form>

    <script>
        function calc() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            let BMI;

            if (height > 0) {
                BMI = weight / (height * height);
                document.getElementById("result").innerHTML = "BMI: " + BMI.toFixed(2);

                if (BMI >= 25) {
                    document.getElementById("result2").innerHTML = "비만입니다.";
                } else if (BMI >= 23) {
                    document.getElementById("result2").innerHTML = "과체중입니다.";
                } else if (BMI >= 18.5) {
                    document.getElementById("result2").innerHTML = "정상입니다.";
                } else {
                    document.getElementById("result2").innerHTML = "저체중입니다.";
                }
            } else {
                document.getElementById("result").innerHTML = "신장은 0보다 커야 합니다.";
            }
        }

        function sub() {
            const name = prompt('이름을 입력해주세요.');
            if (name) {
                document.getElementById("test").innerHTML = "Welcome " + name;
            }
        }
    </script>
    <footer>

            <li>개인정보보호정책</li>
            <li>인재채용</li>
            <li>공지사항</li>

    </footer>
</body>
